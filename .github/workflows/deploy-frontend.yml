name: Deploy front-end (AWS S3 + CloudFront)

# Faz o build de producao do Angular, envia para o S3 e limpa o cache do CloudFront.
# Enquanto os secrets da AWS nao estiverem configurados, o deploy e pulado.
on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    outputs:
      configurado: ${{ steps.check.outputs.configurado }}
    steps:
      - id: check
        env:
          BUCKET: ${{ secrets.AWS_S3_BUCKET }}
        run: |
          if [ -n "$BUCKET" ]; then echo "configurado=true" >> "$GITHUB_OUTPUT";
          else echo "configurado=false" >> "$GITHUB_OUTPUT"; echo "Secrets da AWS ainda nao configurados: deploy pulado."; fi

  deploy:
    needs: verificar
    if: needs.verificar.outputs.configurado == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npx ng build

      - name: Credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Enviar para o S3
        run: |
          # arquivos com hash no nome podem ficar em cache por 1 ano; o index.html nunca
          aws s3 sync dist/frontend/browser "s3://${{ secrets.AWS_S3_BUCKET }}" --delete \
            --exclude index.html --cache-control "public,max-age=31536000,immutable"
          aws s3 cp dist/frontend/browser/index.html "s3://${{ secrets.AWS_S3_BUCKET }}/index.html" \
            --cache-control "no-cache"

      - name: Invalidar cache do CloudFront
        run: aws cloudfront create-invalidation --distribution-id "${{ secrets.AWS_CLOUDFRONT_DISTRIBUTION_ID }}" --paths "/*"
