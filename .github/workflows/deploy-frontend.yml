name: Deploy front-end (AWS EC2 + nginx)

# Faz o build de produção do Angular e publica os arquivos na EC2, onde o nginx serve o site
# em https://www.bussolaacademica.com.br (mesmo servidor da API).
# Roda a cada merge na main (ou manualmente). Enquanto os secrets da EC2 não existirem, o deploy é pulado.
on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    outputs:
      configurado: ${{ steps.check.outputs.configurado }}
    steps:
      - id: check
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          if [ -n "$EC2_HOST" ]; then echo "configurado=true" >> "$GITHUB_OUTPUT";
          else echo "configurado=false" >> "$GITHUB_OUTPUT"; echo "Secrets da EC2 ainda não configurados: deploy pulado."; fi

  deploy:
    needs: verificar
    if: needs.verificar.outputs.configurado == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build de produção
        working-directory: frontend
        run: |
          npm ci
          npx ng build
          tar -C dist/frontend/browser -czf ../front.tgz .

      - name: Enviar o build para a EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: front.tgz
          target: /tmp

      - name: Publicar (troca a pasta de uma vez, sem deixar o site pela metade)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            rm -rf /var/www/bussola.new && mkdir -p /var/www/bussola.new
            tar -xzf /tmp/front.tgz -C /var/www/bussola.new
            rm -rf /var/www/bussola.old
            if [ -d /var/www/bussola ]; then mv /var/www/bussola /var/www/bussola.old; fi
            mv /var/www/bussola.new /var/www/bussola
            rm -f /tmp/front.tgz
            curl -fs -o /dev/null -H "Host: www.bussolaacademica.com.br" http://127.0.0.1/ && echo "Front no ar"
