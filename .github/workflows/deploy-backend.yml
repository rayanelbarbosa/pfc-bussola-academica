name: Deploy back-end (AWS EC2)

# Gera a imagem Docker do back-end, publica no GitHub Container Registry
# e atualiza o container na EC2. Roda a cada merge na main (ou manualmente).
# Enquanto os secrets da AWS nao estiverem configurados, o deploy e pulado.
on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGEM: ghcr.io/${{ github.repository_owner }}/bussola-backend

jobs:
  verificar:
    runs-on: ubuntu-latest
    outputs:
      configurado: ${{ steps.check.outputs.configurado }}
    steps:
      - id: check
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          if [ -n "$EC2_HOST" ]; then echo "configurado=true" >> "$GITHUB_OUTPUT";
          else echo "configurado=false" >> "$GITHUB_OUTPUT"; echo "Secrets da EC2 ainda nao configurados: deploy pulado."; fi

  deploy:
    needs: verificar
    if: needs.verificar.outputs.configurado == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push da imagem
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ${{ env.IMAGEM }}:latest
            ${{ env.IMAGEM }}:${{ github.sha }}

      - name: Atualizar container na EC2
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGEM: ${{ env.IMAGEM }}:${{ github.sha }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: IMAGEM,GHCR_TOKEN,GHCR_USER
          script: |
            set -e
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker pull "$IMAGEM"
            docker rm -f bussola-backend 2>/dev/null || true
            docker run -d --name bussola-backend --restart unless-stopped \
              --env-file /opt/bussola/.env -p 127.0.0.1:8080:8080 "$IMAGEM"
            docker image prune -af --filter "until=72h"
            for i in $(seq 1 30); do
              if curl -fs http://127.0.0.1:8080/actuator/health >/dev/null; then echo "API no ar"; exit 0; fi
              sleep 3
            done
            docker logs --tail 80 bussola-backend
            exit 1
