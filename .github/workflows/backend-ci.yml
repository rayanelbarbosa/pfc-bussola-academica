name: Backend CI

# Roda só no push: o PR aberto pelo auto-pr usa o mesmo commit, então o resultado
# já aparece nos checks do PR (rodar também no pull_request duplicava a execução
# e, como o PR é aberto pelo github-actions[bot], o GitHub pedia aprovação manual).
on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Linter (Checkstyle)
        run: mvn -B checkstyle:check

      - name: Build e testes (com cobertura JaCoCo)
        run: mvn -B verify

      - name: Publicar relatorio de testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-testes
          path: backend/target/surefire-reports

      - name: Publicar relatorio de cobertura (JaCoCo)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-cobertura-jacoco
          path: backend/target/site/jacoco
