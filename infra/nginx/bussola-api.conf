# nginx na EC2: serve o front-end (Angular) e faz proxy reverso da API (Spring Boot em 127.0.0.1:8080).
# Copiar para /etc/nginx/conf.d/bussola.conf. O Certbot cria o certificado HTTPS e acrescenta
# sozinho as linhas "listen 443 ssl" e "ssl_*" neste arquivo.

# Limite de requisições por IP (RNF de segurança): protege a API de abuso e reforça o
# bloqueio de força bruta que o back-end já faz por conta (5 tentativas em 15 minutos).
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;

# Domínio raiz (sem www) -> redireciona para o front-end no www
server {
    listen 80;
    server_name bussolaacademica.com.br;
    return 301 https://www.bussolaacademica.com.br$request_uri;
}

# Front-end: arquivos do build do Angular, publicados pelo workflow deploy-frontend.yml
server {
    listen 80;
    server_name www.bussolaacademica.com.br;

    root /var/www/bussola;
    index index.html;
    server_tokens off;

    # Cabeçalhos de segurança. A CSP só permite scripts e estilos do próprio site, imagens das
    # miniaturas do YouTube e chamadas para a API: protege o token de sessão contra XSS.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://i.ytimg.com; font-src 'self'; connect-src 'self' https://api.bussolaacademica.com.br; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # Arquivos com hash no nome podem ficar em cache por 1 ano; o index.html nunca
    location ~* \.(?:js|css|woff2?|png|svg|ico|webp)$ {
        expires 1y;
        try_files $uri =404;
    }

    # Rotas do Angular (ex.: /meus-resultados) caem no index.html
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}

# API
server {
    listen 80;
    server_name api.bussolaacademica.com.br;

    client_max_body_size 2m;
    server_tokens off;
    limit_req_status 429;

    # A API só devolve JSON, então a CSP bloqueia todo o resto
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;

    # Login, cadastro e recuperação de senha: limite mais rígido
    location /api/auth/ {
        limit_req zone=auth burst=20 nodelay;
        proxy_pass http://127.0.0.1:8080;
    }

    location / {
        limit_req zone=api burst=40 nodelay;
        proxy_pass http://127.0.0.1:8080;
    }
}
