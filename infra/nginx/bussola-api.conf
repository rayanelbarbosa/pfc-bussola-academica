# nginx na EC2: proxy reverso HTTPS -> Spring Boot (container em 127.0.0.1:8080).
# Copiar para /etc/nginx/conf.d/bussola-api.conf e trocar SEU_DOMINIO pelo dominio real.
# O certificado HTTPS e criado pelo Certbot (ele mesmo adiciona as linhas "ssl_*").

# Dominio raiz (sem www) -> redireciona para o front-end no www
server {
    listen 80;
    server_name SEU_DOMINIO;
    return 301 https://www.SEU_DOMINIO$request_uri;
}

# API
server {
    listen 80;
    server_name api.SEU_DOMINIO;

    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
