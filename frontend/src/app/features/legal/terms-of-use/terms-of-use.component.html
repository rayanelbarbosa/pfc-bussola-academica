<div class="container-page section-y max-w-3xl">
  <article class="legal-doc">
    <h1>Termo de Uso</h1>
    @if (terms(); as t) {
      <p class="text-sm text-muted-foreground">Versão {{ t.version }}, vigente desde {{ t.publishedAt | date: 'dd/MM/yyyy' }}</p>
      <app-legal-document [content]="t.termsOfUse" />
    } @else if (error()) {
      <div class="alert alert-error mt-4" role="alert">{{ error() }}</div>
    } @else {
      <div class="skeleton mt-4 h-64"></div>
    }
  </article>
</div>
