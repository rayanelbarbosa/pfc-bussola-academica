spring.application.name=bussola-academica-backend

# Conexao com o banco (Postgres/Neon em producao; ver application-dev.properties para uso local)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/bussola_academica}
spring.datasource.username=${DB_USER:bussola}
spring.datasource.password=${DB_PASSWORD:bussola}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

server.port=${SERVER_PORT:8080}

# CORS simples pro front-end Angular em desenvolvimento
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
