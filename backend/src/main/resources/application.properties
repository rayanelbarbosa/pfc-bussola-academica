# ===== Configuracao comum a todos os ambientes =====
spring.application.name=bussola-academica-backend

# Perfil ativo: "dev" (padrao, na maquina local) ou "prod" (servidor na AWS)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Le variaveis locais do arquivo backend/.env (fora do Git). No servidor elas vem do ambiente.
spring.config.import=optional:file:.env[.properties]

# Banco PostgreSQL (Neon). Os valores vem SEMPRE de variaveis de ambiente, nunca do codigo.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Pool de conexoes (Hikari) ajustado pro Neon: o Neon fecha conexoes paradas e "dorme" apos 5 min sem uso.
# As conexoes sao renovadas antes disso e as ociosas sao fechadas, assim o pool nunca entrega conexao morta
# e o banco consegue dormir quando ninguem usa o site (economiza horas de computacao do plano gratuito).
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.max-lifetime=120000
spring.datasource.hikari.connection-timeout=15000
spring.datasource.hikari.validation-timeout=3000

# O schema e versionado pelo Flyway (src/main/resources/db/migration);
# o Hibernate so confere se as entidades batem com as tabelas.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

server.port=${PORT:8080}
server.error.include-stacktrace=never

# Health check usado pelo servidor/nginx: GET /actuator/health
management.endpoints.web.exposure.include=health

# Front-ends autorizados a chamar a API (separados por virgula)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# Autenticacao: JWT assinado com HS256. JWT_SECRET precisa ter 32+ caracteres (openssl rand -base64 48)
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:120}

# Administrador inicial (criado na inicializacao se ainda nao existir)
app.admin.name=${ADMIN_NAME:Administrador}
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}

# Integracao com a YouTube Data API v3 (chave criada no Google Cloud Console).
# Cada busca custa 100 das 10.000 unidades diarias; o cache de 24 h faz cada carreira gastar cota no maximo 1x por dia.
app.youtube.api-key=${YOUTUBE_API_KEY:}
app.youtube.base-url=https://www.googleapis.com/youtube/v3
app.youtube.max-results=3
app.youtube.cache-hours=24

# Rotina diaria de limpeza (logs de auditoria com mais de 6 meses e tokens revogados ja expirados), 3h30 de Brasilia
app.retention.cron=${RETENTION_CRON:0 30 3 * * *}

# E-mail transacional (recuperacao de senha) pela Resend. Remetente do dominio verificado na Resend.
app.mail.resend-api-key=${RESEND_API_KEY:}
app.mail.base-url=https://api.resend.com
# (acentos em \u porque o .properties e lido como ISO-8859-1)
app.mail.from=${MAIL_FROM:B\u00fassola Acad\u00eamica <nao-responda@mail.bussolaacademica.com.br>}
# Endereco do front usado no link do e-mail (em producao: https://www.bussolaacademica.com.br)
app.mail.frontend-url=${FRONTEND_URL:http://localhost:4200}
