# ===== Configuracao comum a todos os ambientes =====
spring.application.name=bussola-academica-backend

# Perfil ativo: "dev" (padrao, na maquina local) ou "prod" (servidor na AWS)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Le variaveis locais do arquivo backend/.env (fora do Git). No servidor elas vem do ambiente.
spring.config.import=optional:file:.env[.properties]

# Banco PostgreSQL (Neon). Os valores vem SEMPRE de variaveis de ambiente, nunca do codigo.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# O schema e versionado pelo Flyway (src/main/resources/db/migration);
# o Hibernate so confere se as entidades batem com as tabelas.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

server.port=${PORT:8080}
server.error.include-stacktrace=never

# Health check usado pelo servidor/nginx: GET /actuator/health
management.endpoints.web.exposure.include=health

# Front-ends autorizados a chamar a API (separados por virgula)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# Autenticacao: JWT assinado com HS256. JWT_SECRET precisa ter 32+ caracteres (openssl rand -base64 48)
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:120}

# Administrador inicial (criado na inicializacao se ainda nao existir)
app.admin.name=${ADMIN_NAME:Administrador}
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}

# Integracao com a YouTube Data API v3 (chave criada no Google Cloud Console)
app.youtube.api-key=${YOUTUBE_API_KEY:}
app.youtube.base-url=https://www.googleapis.com/youtube/v3
app.youtube.max-results=3
app.youtube.cache-hours=6
