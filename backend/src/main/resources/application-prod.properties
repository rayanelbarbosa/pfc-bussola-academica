# ===== Perfil prod: servidor na AWS (EC2), atras do nginx com HTTPS =====
spring.jpa.show-sql=false
logging.level.root=INFO
logging.level.br.com.bussolaacademica=INFO

# Respeita os cabecalhos X-Forwarded-* enviados pelo nginx (proxy reverso)
server.forward-headers-strategy=framework

# Em producao o CORS precisa ser informado explicitamente (dominio do front-end)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
